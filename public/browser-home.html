<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; form-action https://www.google.com">
  <title>Nexus New Tab</title>
  <style>
    :root { color-scheme: light; --paper: #f4f4eb; --ink: #151711; --muted: #666b5e; --line: #c5c9b9; --acid: #b7ef37; --signal: #ed5d38; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { background: var(--paper); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
    main { min-height: 100vh; display: grid; grid-template-columns: 72px 1fr; }
    .rail { border-right: 1px solid var(--line); display: flex; justify-content: center; padding: 28px 0; }
    .rail span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 10px; font-weight: 900; text-transform: uppercase; }
    .workspace { display: flex; flex-direction: column; justify-content: space-between; padding: clamp(36px, 7vw, 92px); }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 11px; text-transform: uppercase; font-weight: 800; }
    .status { display: inline-flex; align-items: center; gap: 8px; }
    .status::before { content: ''; width: 8px; height: 8px; background: var(--acid); border: 1px solid var(--ink); }
    .center { width: min(860px, 100%); margin: 12vh auto; }
    .eyebrow { margin: 0 0 24px; color: var(--signal); font-size: 12px; font-weight: 900; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0 0 42px; font-size: clamp(52px, 8vw, 108px); line-height: .88; font-weight: 900; }
    form { display: flex; align-items: stretch; border: 2px solid var(--ink); background: white; box-shadow: 8px 8px 0 var(--ink); }
    input { min-width: 0; flex: 1; height: 60px; border: 0; outline: 0; padding: 0 20px; color: var(--ink); background: transparent; font: 600 16px/1 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
    button { width: 62px; border: 0; border-left: 2px solid var(--ink); background: var(--acid); color: var(--ink); font-size: 24px; cursor: pointer; }
    .quick { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 34px; }
    .quick a { color: var(--ink); font-size: 12px; font-weight: 800; text-decoration: none; border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
    footer { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; text-transform: uppercase; font-weight: 800; }
    @media (max-width: 680px) { main { grid-template-columns: 36px 1fr; } .workspace { padding: 28px 22px; } .center { margin: 9vh auto; } h1 { font-size: 50px; } footer { gap: 16px; flex-direction: column; } }
  </style>
</head>
<body>
  <main>
    <aside class="rail"><span>Nexus / Chromium / Local</span></aside>
    <section class="workspace">
      <div class="topline"><strong>Nexus Browser</strong><span class="status">Agent surface ready</span></div>
      <div class="center">
        <p class="eyebrow">New tab / live browser context</p>
        <h1>Browse. Inspect. Build.</h1>
        <form action="https://www.google.com/search" method="get">
          <input type="search" name="q" autocomplete="off" autofocus aria-label="Search the web" placeholder="Search the web">
          <button type="submit" aria-label="Search">→</button>
        </form>
        <nav class="quick" aria-label="Nexus shortcuts">
          <a href="/">Workspace</a>
          <a href="/#chat">Agent chat</a>
          <a href="/health">Runtime health</a>
        </nav>
      </div>
      <footer><span>Chromium page surface</span><span>Nexus agents remain attached to every tab</span></footer>
    </section>
  </main>
</body>
</html>
