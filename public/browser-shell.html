<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Nexus Browser</title>
  <style>
    :root {
      color-scheme: dark;
      --chrome: #121310;
      --chrome-raised: #1b1d18;
      --line: #34382e;
      --line-strong: #4c5242;
      --ink: #f5f6ee;
      --muted: #9da292;
      --acid: #c9ff48;
      --signal: #ff7048;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--chrome); color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    .browser-chrome { height: 92px; border-bottom: 1px solid var(--line); background: var(--chrome); user-select: none; }
    .title-row { height: 40px; display: flex; align-items: stretch; border-bottom: 1px solid #23251f; -webkit-app-region: drag; }
    .brand { width: 152px; flex: 0 0 152px; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 11px; font-weight: 800; letter-spacing: 0; }
    .brand-mark { width: 22px; height: 22px; display: grid; place-items: center; border: 1px solid var(--acid); color: var(--acid); font-size: 11px; }
    .brand small { color: var(--muted); font-size: 8px; font-weight: 700; text-transform: uppercase; }
    .tabs { min-width: 0; flex: 1; display: flex; align-items: end; gap: 2px; padding-top: 5px; overflow: hidden; -webkit-app-region: no-drag; }
    .browser-tab { min-width: 90px; max-width: 210px; height: 34px; flex: 1 1 160px; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 12px; border: 1px solid transparent; border-bottom: 0; background: transparent; color: var(--muted); cursor: default; }
    .browser-tab.active { background: var(--chrome-raised); color: var(--ink); border-color: var(--line); }
    .browser-tab.loading .tab-favicon { border-color: var(--acid); }
    .tab-favicon { width: 10px; height: 10px; flex: 0 0 auto; border: 1px solid var(--line-strong); }
    .tab-title { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; }
    .tab-close { width: 20px; height: 20px; margin-left: auto; border: 0; background: transparent; color: var(--muted); padding: 0; cursor: pointer; }
    .tab-close:hover { background: #34372f; color: var(--ink); }
    .chrome-button { width: 34px; height: 34px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; -webkit-app-region: no-drag; }
    .chrome-button:hover:not(:disabled) { background: #2b2e27; color: var(--ink); }
    .chrome-button:disabled { opacity: .3; cursor: default; }
    .new-tab { align-self: center; margin: 0 4px; }
    .window-actions { margin-left: auto; display: flex; align-items: center; -webkit-app-region: no-drag; }
    .window-actions .chrome-button { width: 42px; height: 40px; }
    .window-actions .close:hover { background: #b52b2b; color: white; }
    .agent-toggle { width: 42px !important; position: relative; }
    .agent-toggle::after { content: ''; position: absolute; bottom: 5px; width: 12px; height: 2px; background: transparent; }
    .agent-toggle.active { color: var(--acid); }
    .agent-toggle.active::after { background: var(--acid); }
    .nav-row { height: 50px; display: flex; align-items: center; gap: 4px; padding: 7px 10px; background: var(--chrome-raised); -webkit-app-region: no-drag; }
    .nav-row .chrome-button { width: 34px; height: 34px; flex: 0 0 auto; font-size: 17px; }
    .address-wrap { height: 34px; min-width: 180px; flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: #0d0e0c; padding: 0 10px; }
    .address-wrap:focus-within { border-color: var(--acid); }
    .site-state { color: var(--acid); font-size: 9px; font-weight: 900; }
    #address { width: 100%; border: 0; outline: 0; background: transparent; color: var(--ink); font-size: 12px; }
    #address::selection { background: var(--acid); color: #11120f; }
    .agent-label { width: auto !important; min-width: 104px; padding: 0 12px; gap: 7px; display: flex !important; font-size: 10px !important; font-weight: 800; text-transform: uppercase; border-left: 1px solid var(--line); }
    .agent-label span { width: 7px; height: 7px; background: var(--signal); }
    .agent-label.active span { background: var(--acid); }
    .load-line { position: absolute; left: 0; top: 90px; width: 0; height: 2px; background: var(--acid); transition: width .18s ease; pointer-events: none; }
    .load-line.active { width: 68%; }
  </style>
</head>
<body>
  <header class="browser-chrome">
    <div class="title-row">
      <div class="brand"><span class="brand-mark">N</span><span>NEXUS<br><small>Chromium shell</small></span></div>
      <div class="tabs" id="tabs" role="tablist" aria-label="Browser tabs"></div>
      <button class="chrome-button new-tab" id="newTab" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
      <div class="window-actions">
        <button class="chrome-button agent-toggle active" id="agentToggle" title="Toggle Nexus agent (Ctrl+Shift+A)" aria-label="Toggle Nexus agent">N</button>
        <button class="chrome-button" id="minimize" title="Minimize" aria-label="Minimize">_</button>
        <button class="chrome-button" id="maximize" title="Maximize" aria-label="Maximize">□</button>
        <button class="chrome-button close" id="close" title="Close" aria-label="Close">×</button>
      </div>
    </div>
    <div class="nav-row">
      <button class="chrome-button" id="back" title="Back (Alt+Left)" aria-label="Back">←</button>
      <button class="chrome-button" id="forward" title="Forward (Alt+Right)" aria-label="Forward">→</button>
      <button class="chrome-button" id="reload" title="Reload (Ctrl+R)" aria-label="Reload">↻</button>
      <button class="chrome-button" id="home" title="Nexus new tab" aria-label="Home">⌂</button>
      <div class="address-wrap">
        <span class="site-state" id="siteState">N</span>
        <input id="address" type="text" spellcheck="false" autocomplete="off" aria-label="Address and search" placeholder="Search or enter address">
      </div>
      <button class="chrome-button agent-label active" id="agentLabel" title="Toggle Nexus agent panel"><span></span>Agent live</button>
    </div>
    <div class="load-line" id="loadLine"></div>
  </header>
  <script src="browser-shell.js"></script>
</body>
</html>
